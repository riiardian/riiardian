<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 360" width="100%" height="100%" fill="none">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c14"/>
      <stop offset="50%" stop-color="#0b101b"/>
      <stop offset="100%" stop-color="#060911"/>
    </linearGradient>

    <!-- Isometric Cube Shading Gradients -->
    <!-- Go/Aero Blue Cube -->
    <linearGradient id="cubeGoTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="cubeGoLeft" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0369a1"/>
      <stop offset="100%" stop-color="#082f49"/>
    </linearGradient>
    <linearGradient id="cubeGoRight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0c4a6e"/>
    </linearGradient>

    <!-- Rust/PaySaku Emerald Cube -->
    <linearGradient id="cubeRustTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="cubeRustLeft" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#047857"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </linearGradient>
    <linearGradient id="cubeRustRight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#065f46"/>
    </linearGradient>

    <!-- Center Edge Gateway Violet/Indigo Cube -->
    <linearGradient id="cubeCenterTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="cubeCenterLeft" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4338ca"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="cubeCenterRight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#312e81"/>
    </linearGradient>

    <!-- Telemetry Amber/Orange Cube -->
    <linearGradient id="cubeAiTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="cubeAiLeft" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#451a03"/>
    </linearGradient>
    <linearGradient id="cubeAiRight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>

    <!-- Laser & Glow Filters -->
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="emeraldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    /* 3D Floating Motion Keyframes */
    @keyframes floatNodeA {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
    }
    @keyframes floatNodeB {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-12px); }
    }
    @keyframes floatNodeC {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }
    @keyframes floatNodeCenter {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-6px); }
    }

    /* 3D Orbital Hologram Rotation */
    @keyframes orbit3D {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes counterOrbit3D {
      0% { transform: rotate(360deg); }
      100% { transform: rotate(0deg); }
    }

    /* Laser Scanning & Pulse */
    @keyframes scanline {
      0% { transform: translateY(0); opacity: 0.1; }
      50% { opacity: 0.6; }
      100% { transform: translateY(350px); opacity: 0.1; }
    }
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.9; }
      50% { opacity: 0.4; }
    }
    @keyframes packetFlow {
      0% { stroke-dashoffset: 400; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes cursorBlink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }

    /* Applied Animation Classes */
    .node-a { animation: floatNodeA 5s ease-in-out infinite; }
    .node-b { animation: floatNodeB 5.6s ease-in-out infinite 0.5s; }
    .node-c { animation: floatNodeC 4.8s ease-in-out infinite 1s; }
    .node-center { animation: floatNodeCenter 6s ease-in-out infinite 0.2s; }
    
    .scanner { animation: scanline 4.5s linear infinite; }
    .stream-cyan { stroke-dasharray: 20 80; animation: packetFlow 4s linear infinite; }
    .stream-emerald { stroke-dasharray: 25 75; animation: packetFlow 3.5s linear infinite; }
    .stream-amber { stroke-dasharray: 18 82; animation: packetFlow 4.2s linear infinite; }
    .beacon { animation: pulseGlow 2s ease-in-out infinite; }
    .cursor-terminal { animation: cursorBlink 1s infinite; }
    
    .orbit-ring { transform-origin: 460px 175px; animation: orbit3D 16s linear infinite; }
    .orbit-ring-inner { transform-origin: 460px 175px; animation: counterOrbit3D 10s linear infinite; }
  </style>

  <!-- Outer Card Frame with Subtle Cyber Border -->
  <rect x="1" y="1" width="918" height="358" rx="10" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="1.2"/>

  <!-- Isometric Ground Mesh (Perspective Grid) -->
  <g opacity="0.25" stroke="#334155" stroke-width="0.8">
    <!-- Isometric Diagonals Axis 1 (Down-Right) -->
    <line x1="60" y1="180" x2="460" y2="340"/>
    <line x1="140" y1="150" x2="540" y2="310"/>
    <line x1="220" y1="120" x2="620" y2="280"/>
    <line x1="300" y1="90" x2="700" y2="250"/>
    <line x1="380" y1="60" x2="780" y2="220"/>
    <line x1="460" y1="30" x2="860" y2="190"/>

    <!-- Isometric Diagonals Axis 2 (Down-Left) -->
    <line x1="860" y1="180" x2="460" y2="340"/>
    <line x1="780" y1="150" x2="380" y2="310"/>
    <line x1="700" y1="120" x2="300" y2="280"/>
    <line x1="620" y1="90" x2="220" y2="250"/>
    <line x1="540" y1="60" x2="140" y2="220"/>
    <line x1="460" y1="30" x2="60" y2="190"/>
  </g>

  <!-- Horizontal Scanline Beam -->
  <line x1="2" y1="0" x2="918" y2="0" stroke="#0ea5e9" stroke-width="1.2" class="scanner"/>

  <!-- Top System Telemetry HUD Bar -->
  <rect x="1" y="1" width="918" height="34" rx="10" fill="#0f172a" fill-opacity="0.85"/>
  <line x1="1" y1="35" x2="919" y2="35" stroke="#1e293b" stroke-width="1"/>
  
  <circle cx="22" cy="18" r="4" fill="#ef4444"/>
  <circle cx="36" cy="18" r="4" fill="#f59e0b"/>
  <circle cx="50" cy="18" r="4" fill="#10b981"/>

  <text x="75" y="22" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="11" font-weight="600" fill="#94a3b8">
    rio@rio-vps: ~ [DISTRIBUTED 3D ARCHITECTURE MATRIX]
  </text>

  <g transform="translate(690, 8)">
    <rect width="215" height="19" rx="4" fill="#064e3b" fill-opacity="0.5" stroke="#059669" stroke-width="0.8"/>
    <circle cx="12" cy="9.5" r="3.5" fill="#10b981" class="beacon"/>
    <text x="24" y="13.5" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" fill="#34d399" letter-spacing="0.5">
      CLUSTER: HEALTHY (100%)
    </text>
  </g>

  <!-- ======================================================== -->
  <!-- 3D CENTRAL ORBITAL HOLOGRAPHIC GYRO (Behind Center Node) -->
  <!-- ======================================================== -->
  <g class="orbit-ring" opacity="0.45">
    <ellipse cx="460" cy="175" rx="110" ry="38" stroke="#6366f1" stroke-width="1.5" stroke-dasharray="14 10" fill="none"/>
    <circle cx="570" cy="175" r="3.5" fill="#818cf8"/>
    <circle cx="350" cy="175" r="3.5" fill="#818cf8"/>
  </g>
  <g class="orbit-ring-inner" opacity="0.35">
    <ellipse cx="460" cy="175" rx="75" ry="26" stroke="#38bdf8" stroke-width="1.2" stroke-dasharray="8 8" fill="none"/>
    <circle cx="460" cy="149" r="3" fill="#38bdf8"/>
    <circle cx="460" cy="201" r="3" fill="#38bdf8"/>
  </g>

  <!-- ======================================================== -->
  <!-- 3D HIGH-SPEED DATA PIPELINES (Isometric Bus Connectors)  -->
  <!-- ======================================================== -->
  <!-- Node A (Left) to Center -->
  <path d="M 220 175 L 340 175 L 420 175" stroke="#1e293b" stroke-width="3" fill="none"/>
  <path d="M 220 175 L 340 175 L 420 175" stroke="#38bdf8" stroke-width="2" fill="none" class="stream-cyan" filter="url(#cyanGlow)"/>

  <!-- Center to Node B (Right) -->
  <path d="M 500 175 L 600 175 L 700 175" stroke="#1e293b" stroke-width="3" fill="none"/>
  <path d="M 500 175 L 600 175 L 700 175" stroke="#10b981" stroke-width="2" fill="none" class="stream-emerald" filter="url(#emeraldGlow)"/>

  <!-- Center to Node C (Top AI Vision) -->
  <path d="M 460 135 L 460 95 L 460 75" stroke="#1e293b" stroke-width="3" fill="none"/>
  <path d="M 460 135 L 460 95 L 460 75" stroke="#f59e0b" stroke-width="2" fill="none" class="stream-amber"/>

  <!-- Center to Ground Ledger Database Pool -->
  <path d="M 460 215 L 460 270" stroke="#1e293b" stroke-width="3" fill="none"/>
  <path d="M 460 215 L 460 270" stroke="#818cf8" stroke-width="2" stroke-dasharray="10 10" fill="none" class="stream-cyan"/>


  <!-- ======================================================== -->
  <!-- NODE 01: AEROFLAZZ FINANCIAL CORE (Left 3D Cube)         -->
  <!-- ======================================================== -->
  <g class="node-a" transform="translate(180, 140)">
    <!-- Isometric 3D Cube: Center at (0, 0), Width=70, Depth=40 -->
    <!-- Top Face -->
    <polygon points="0,-35 35,-17 0,0 -35,-17" fill="url(#cubeGoTop)" stroke="#7dd3fc" stroke-width="0.8"/>
    <!-- Left Face -->
    <polygon points="-35,-17 0,0 0,38 -35,21" fill="url(#cubeGoLeft)" stroke="#0284c7" stroke-width="0.8"/>
    <!-- Right Face -->
    <polygon points="0,0 35,-17 35,21 0,38" fill="url(#cubeGoRight)" stroke="#0369a1" stroke-width="0.8"/>
    <!-- Center Core Glow -->
    <circle cx="0" cy="-17" r="4" fill="#ffffff" opacity="0.9" filter="url(#softGlow)"/>

    <!-- Labels & Telemetry Badge (Floating Above Cube) -->
    <text x="0" y="-55" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="700" fill="#38bdf8" text-anchor="middle" letter-spacing="1">
      [01] AEROFLAZZ CORE
    </text>
    <text x="0" y="-42" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="600" fill="#94a3b8" text-anchor="middle">
      Go Fiber • Double-Entry Ledger
    </text>

    <!-- Metrics Below Cube -->
    <g transform="translate(0, 56)">
      <rect x="-70" y="0" width="140" height="26" rx="4" fill="#090d16" fill-opacity="0.8" stroke="#1e293b" stroke-width="0.8"/>
      <text x="-62" y="12" font-family="'JetBrains Mono', monospace" font-size="8" fill="#64748b">INVARIANT: ZERO-SUM</text>
      <text x="-62" y="22" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="700" fill="#38bdf8">DEBIT == CREDIT [OK]</text>
    </g>
  </g>

  <!-- ======================================================== -->
  <!-- NODE 02: EDGE DISPATCHER & REVERSE PROXY (Center Cube)   -->
  <!-- ======================================================== -->
  <g class="node-center" transform="translate(460, 165)">
    <!-- Master 3D Cube: Center at (0, 0), Width=84, Depth=48 -->
    <!-- Top Face -->
    <polygon points="0,-42 42,-21 0,0 -42,-21" fill="url(#cubeCenterTop)" stroke="#a5b4fc" stroke-width="0.8"/>
    <!-- Left Face -->
    <polygon points="-42,-21 0,0 0,44 -42,23" fill="url(#cubeCenterLeft)" stroke="#4f46e5" stroke-width="0.8"/>
    <!-- Right Face -->
    <polygon points="0,0 42,-21 42,23 0,44" fill="url(#cubeCenterRight)" stroke="#4338ca" stroke-width="0.8"/>
    <!-- Glowing Pulsing Beacon in Core -->
    <circle cx="0" cy="-21" r="5" fill="#ffffff" opacity="0.95" filter="url(#cyanGlow)"/>

    <!-- Labels Above Center -->
    <text x="0" y="-62" font-family="'JetBrains Mono', monospace" font-size="11.5" font-weight="800" fill="#818cf8" text-anchor="middle" letter-spacing="1">
      [00] EDGE GATEWAY &amp; BUS
    </text>
    <text x="0" y="-48" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="600" fill="#c7d2fe" text-anchor="middle">
      Zero-Trust Proxy • Redis Mutex
    </text>

    <!-- Metrics Below Center Cube -->
    <g transform="translate(0, 62)">
      <rect x="-80" y="0" width="160" height="28" rx="4" fill="#090d16" fill-opacity="0.85" stroke="#312e81" stroke-width="0.8"/>
      <text x="0" y="13" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="600" fill="#94a3b8" text-anchor="middle">
        EDGE LATENCY: &lt; 0.28ms
      </text>
      <text x="0" y="23" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="700" fill="#a5b4fc" text-anchor="middle">
        CIRCUIT BREAKER: ARMED
      </text>
    </g>
  </g>

  <!-- ======================================================== -->
  <!-- NODE 03: PAYSAKU V2 CRYPTOGRAPHIC GATEWAY (Right Cube)   -->
  <!-- ======================================================== -->
  <g class="node-b" transform="translate(740, 140)">
    <!-- Isometric 3D Cube: Center at (0, 0), Width=70, Depth=40 -->
    <!-- Top Face -->
    <polygon points="0,-35 35,-17 0,0 -35,-17" fill="url(#cubeRustTop)" stroke="#6ee7b7" stroke-width="0.8"/>
    <!-- Left Face -->
    <polygon points="-35,-17 0,0 0,38 -35,21" fill="url(#cubeRustLeft)" stroke="#059669" stroke-width="0.8"/>
    <!-- Right Face -->
    <polygon points="0,0 35,-17 35,21 0,38" fill="url(#cubeRustRight)" stroke="#047857" stroke-width="0.8"/>
    <!-- Center Core Glow -->
    <circle cx="0" cy="-17" r="4" fill="#ffffff" opacity="0.9" filter="url(#emeraldGlow)"/>

    <!-- Labels Above Cube -->
    <text x="0" y="-55" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="700" fill="#34d399" text-anchor="middle" letter-spacing="1">
      [02] PAYSAKU V2 ENGINE
    </text>
    <text x="0" y="-42" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="600" fill="#94a3b8" text-anchor="middle">
      Native Rust • Ed25519 FAPI
    </text>

    <!-- Metrics Below Cube -->
    <g transform="translate(0, 56)">
      <rect x="-70" y="0" width="140" height="26" rx="4" fill="#090d16" fill-opacity="0.8" stroke="#1e293b" stroke-width="0.8"/>
      <text x="-62" y="12" font-family="'JetBrains Mono', monospace" font-size="8" fill="#64748b">NON-REPUDIATION: PASS</text>
      <text x="-62" y="22" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="700" fill="#34d399">ZERO PRIVATE KEY STORAGE</text>
    </g>
  </g>

  <!-- ======================================================== -->
  <!-- NODE 04: KERTANUSA VISION & TELEMETRY (Top Node)        -->
  <!-- ======================================================== -->
  <g class="node-c" transform="translate(460, 68)">
    <!-- Smaller Isometric 3D Cube: Width=50, Depth=28 -->
    <!-- Top Face -->
    <polygon points="0,-25 25,-12 0,0 -25,-12" fill="url(#cubeAiTop)" stroke="#fde68a" stroke-width="0.8"/>
    <!-- Left Face -->
    <polygon points="-25,-12 0,0 0,26 -25,14" fill="url(#cubeAiLeft)" stroke="#d97706" stroke-width="0.8"/>
    <!-- Right Face -->
    <polygon points="0,0 25,-12 25,14 0,26" fill="url(#cubeAiRight)" stroke="#b45309" stroke-width="0.8"/>
    <circle cx="0" cy="-12" r="3" fill="#ffffff" opacity="0.9"/>

    <text x="35" y="-14" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="700" fill="#fbbf24">
      KERTANUSA TELEMETRY (FAO-56 / ECMWF)
    </text>
  </g>

  <!-- ======================================================== -->
  <!-- BOTTOM POSTGRESQL & LEDGER PERSISTENCE BASE (Ground)     -->
  <!-- ======================================================== -->
  <g transform="translate(460, 298)">
    <polygon points="0,-18 110,0 0,18 -110,0" fill="#090d16" stroke="#334155" stroke-width="1.2"/>
    <ellipse cx="0" cy="0" rx="90" ry="12" fill="#0f172a" stroke="#475569" stroke-width="0.8"/>
    <text x="0" y="4" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" fill="#94a3b8" text-anchor="middle" letter-spacing="1">
      POSTGRESQL ACID LEDGER POOL
    </text>
  </g>

  <!-- Live Prompt Line at Bottom Left -->
  <g transform="translate(25, 335)">
    <text font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600" fill="#64748b">
      SYSTEM PROTOCOL: <tspan fill="#38bdf8">ENCRYPTED DUAL-RESOLUTION</tspan> | RECOVERY: <tspan fill="#34d399">AUTOMATIC</tspan>
      <tspan class="cursor-terminal" fill="#38bdf8"> _</tspan>
    </text>
  </g>

  <!-- Bottom Accent Gradient Line -->
  <rect x="0" y="356" width="920" height="4" fill="url(#cubeGoTop)"/>
</svg>
