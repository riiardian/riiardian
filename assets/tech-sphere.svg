<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-label="Rio Ardian Pratama Tech Sphere">
  <defs>
    <radialGradient id="ts-halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0"   stop-color="#38bdf8" stop-opacity="0.3"/>
      <stop offset="0.6" stop-color="#38bdf8" stop-opacity="0.05"/>
      <stop offset="1"   stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ts-sphere" cx="0.35" cy="0.3" r="0.7">
      <stop offset="0"   stop-color="#1e293b"/>
      <stop offset="0.6" stop-color="#0f172a"/>
      <stop offset="1"   stop-color="#020617"/>
    </radialGradient>
    <radialGradient id="ts-shine" cx="0.3" cy="0.25" r="0.3">
      <stop offset="0" stop-color="#818cf8" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#818cf8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ts-rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#818cf8" stop-opacity="0.3"/>
    </linearGradient>
    <filter id="ts-soft">
      <feGaussianBlur stdDeviation="0.8"/>
    </filter>
  </defs>

  <rect width="1200" height="420" fill="#0d1117" rx="12"/>

  <!-- Background grid -->
  <g stroke="#161b22" stroke-width="0.8">
    <line x1="0" y1="100" x2="1200" y2="100"/>
    <line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="200" y1="0" x2="200" y2="420"/>
    <line x1="400" y1="0" x2="400" y2="420"/>
    <line x1="600" y1="0" x2="600" y2="420"/>
    <line x1="800" y1="0" x2="800" y2="420"/>
    <line x1="1000" y1="0" x2="1000" y2="420"/>
  </g>

  <!-- Side panel — left -->
  <g transform="translate(60,75)">
    <g font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="11" letter-spacing="4" fill="#38bdf8">
      <line x1="0" y1="-10" x2="20" y2="-10" stroke="#38bdf8" stroke-width="0.8"/>
      <text x="28" y="-6">SYSTEM ARCHITECTURE · CORE</text>
    </g>
    <text y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="46" font-weight="700" fill="#f0f6fc" letter-spacing="-1">Rio Ardian Pratama</text>
    <text y="70" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="12" fill="#38bdf8" letter-spacing="2">SOFTWARE ENGINEER · DISTRIBUTED SYSTEMS</text>

    <line x1="0" y1="100" x2="400" y2="100" stroke="#30363d" stroke-width="0.8"/>

    <text y="128" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="12" fill="#8b949e">Architecting resilient, high-concurrency</text>
    <text y="150" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="12" fill="#8b949e">transactional platforms and production APIs.</text>
    <text y="172" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="12" fill="#8b949e">Pessimistic locking, asynchronous workers,</text>
    <text y="194" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="12" fill="#8b949e">and AI-driven multimodal precision telemetry.</text>

    <line x1="0" y1="220" x2="400" y2="220" stroke="#30363d" stroke-width="0.8"/>

    <g transform="translate(0,250)" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="11" fill="#8b949e" letter-spacing="2">
      <text>OUTER ORBIT</text>   <text x="120" fill="#38bdf8">go · next.js · typescript</text>
      <text y="22">CORE ENGINE</text>   <text x="120" y="22" fill="#38bdf8">postgresql · redis · laravel</text>
      <text y="44">INFRA / AI</text>    <text x="120" y="44" fill="#a78bfa">linux · nginx · vision-ai</text>
    </g>
  </g>

  <!-- Vertical separator -->
  <line x1="510" y1="50" x2="510" y2="380" stroke="#30363d" stroke-width="0.8"/>

  <!-- Sphere — right -->
  <g transform="translate(850,210)">
    <!-- Halo -->
    <circle r="220" fill="url(#ts-halo)"/>
    <!-- Sphere base -->
    <circle r="160" fill="url(#ts-sphere)"/>
    <!-- Specular shine -->
    <circle r="160" fill="url(#ts-shine)"/>
    <!-- Rim light -->
    <circle r="160" fill="none" stroke="url(#ts-rim)" stroke-width="1.5"/>

    <!-- Latitude ellipses (rotating group) -->
    <g filter="url(#ts-soft)">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="24s" repeatCount="indefinite"/>
      <ellipse rx="160" ry="60" fill="none" stroke="#38bdf8" stroke-width="0.8" opacity="0.6"/>
      <ellipse rx="160" ry="60" fill="none" stroke="#38bdf8" stroke-width="0.6" opacity="0.4" transform="rotate(60)"/>
      <ellipse rx="160" ry="60" fill="none" stroke="#38bdf8" stroke-width="0.6" opacity="0.4" transform="rotate(120)"/>
      <ellipse rx="160" ry="25" fill="none" stroke="#818cf8" stroke-width="0.6" opacity="0.5"/>
      <ellipse rx="160" ry="105" fill="none" stroke="#818cf8" stroke-width="0.6" opacity="0.4"/>
      <ellipse rx="60" ry="160" fill="none" stroke="#38bdf8" stroke-width="0.6" opacity="0.4"/>
      <ellipse rx="120" ry="160" fill="none" stroke="#38bdf8" stroke-width="0.6" opacity="0.4"/>
    </g>

    <!-- Tech tokens (counter-rotating to stay readable) -->
    <g font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="13" font-weight="600">
      <animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="24s" repeatCount="indefinite"/>
      
      <g transform="translate(-135,-24)">
        <circle r="3.5" fill="#38bdf8"/>
        <text x="10" y="4" fill="#38bdf8">golang</text>
      </g>
      <g transform="translate(-70,-115)">
        <circle r="3.5" fill="#38bdf8"/>
        <text x="10" y="4" fill="#38bdf8">next.js</text>
      </g>
      <g transform="translate(-105,85)">
        <circle r="3.5" fill="#38bdf8"/>
        <text x="10" y="4" fill="#38bdf8">typescript</text>
      </g>
      <g transform="translate(95,55)">
        <circle r="3.5" fill="#38bdf8"/>
        <text x="10" y="4" fill="#38bdf8">postgresql</text>
      </g>
      <g transform="translate(10,115)">
        <circle r="3.5" fill="#38bdf8"/>
        <text x="10" y="4" fill="#38bdf8">redis</text>
      </g>
      <g transform="translate(85,-35)">
        <circle r="3.5" fill="#a78bfa"/>
        <text x="-10" y="4" text-anchor="end" fill="#a78bfa">laravel</text>
      </g>
      <g transform="translate(38,-85)">
        <circle r="3.5" fill="#a78bfa"/>
        <text x="10" y="4" fill="#a78bfa">linux/vps</text>
      </g>
      <g transform="translate(20,24)" opacity="0.85">
        <text x="0" y="0" font-style="italic" fill="#fef08a">// vision-ai</text>
      </g>
    </g>

    <!-- Center node -->
    <circle r="6" fill="#fef08a">
      <animate attributeName="r" values="5;7.5;5" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <circle r="15" fill="none" stroke="#fef08a" stroke-width="0.8" opacity="0.6">
      <animate attributeName="r" values="14;24;14" dur="2.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0;0.6" dur="2.4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Bottom register -->
  <g transform="translate(60,396)" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="10" letter-spacing="3" fill="#8b949e">
    <text>GITHUB: @RIIARDIAN  ·  ARDIANRIO990@GMAIL.COM  ·  INDONESIA</text>
  </g>
  <text x="1140" y="396" text-anchor="end" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="10" fill="#a78bfa" letter-spacing="3">↻ 3D ORBIT T = 24s</text>
</svg>
