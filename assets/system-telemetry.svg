<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 200" width="100%" height="200" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#0a0f1d"/>
    </linearGradient>
    <linearGradient id="cyanLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.1"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="greenPulse" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    @keyframes scan {
      0% { transform: translateY(0); opacity: 0.15; }
      50% { opacity: 0.5; }
      100% { transform: translateY(190px); opacity: 0.15; }
    }
    @keyframes pulseLed {
      0%, 100% { opacity: 1; filter: drop-shadow(0 0 6px #10b981); }
      50% { opacity: 0.35; filter: none; }
    }
    @keyframes radarSweep {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes dataStream {
      0% { stroke-dashoffset: 400; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes textBlink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    .grid-line { stroke: #1e293b; stroke-width: 0.7; stroke-opacity: 0.4; }
    .scan-line { animation: scan 4s linear infinite; stroke: #38bdf8; stroke-width: 1.2; stroke-opacity: 0.4; }
    .led { animation: pulseLed 2s ease-in-out infinite; }
    .stream { stroke-dasharray: 60 120; animation: dataStream 6s linear infinite; }
    .cursor { animation: textBlink 1s infinite; }
  </style>

  <!-- Background Card -->
  <rect x="1" y="1" width="838" height="198" rx="8" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Subtle Cyber Grid -->
  <line x1="20" y1="50" x2="820" y2="50" class="grid-line"/>
  <line x1="20" y1="100" x2="820" y2="100" class="grid-line"/>
  <line x1="20" y1="150" x2="820" y2="150" class="grid-line"/>
  <line x1="280" y1="10" x2="280" y2="190" class="grid-line"/>
  <line x1="560" y1="10" x2="560" y2="190" class="grid-line"/>

  <!-- Scanning Laser Beam -->
  <line x1="10" y1="10" x2="830" y2="10" class="scan-line"/>

  <!-- Header Bar -->
  <rect x="1" y="1" width="838" height="34" rx="8" fill="#0f172a" fill-opacity="0.8"/>
  <line x1="1" y1="35" x2="839" y2="35" stroke="#1e293b" stroke-width="1"/>
  
  <!-- Terminal Window Controls -->
  <circle cx="22" cy="18" r="4.5" fill="#ef4444"/>
  <circle cx="36" cy="18" r="4.5" fill="#f59e0b"/>
  <circle cx="50" cy="18" r="4.5" fill="#10b981"/>

  <text x="75" y="22" font-family="'Fira Code', 'JetBrains Mono', Courier, monospace" font-size="11" font-weight="600" fill="#94a3b8">
    rio@production-edge-node-01: ~ (aero-network)
  </text>

  <!-- Live Status Pill -->
  <g transform="translate(680, 10)">
    <rect width="138" height="17" rx="3" fill="#064e3b" fill-opacity="0.4" stroke="#059669" stroke-width="0.8"/>
    <circle cx="12" cy="8.5" r="3.5" fill="#10b981" class="led"/>
    <text x="24" y="12" font-family="'Fira Code', monospace" font-size="9" font-weight="700" fill="#34d399" letter-spacing="0.5">SYS-ACTIVE: 100%</text>
  </g>

  <!-- Column 1: Core Engine -->
  <text x="28" y="66" font-family="'Fira Code', monospace" font-size="10" font-weight="700" fill="#38bdf8" letter-spacing="1">
    [01] TRANSACTIONAL ENGINE
  </text>
  <text x="28" y="86" font-family="'Fira Code', monospace" font-size="11" font-weight="600" fill="#f1f5f9">
    AeroFlazz Core Gateway
  </text>
  <text x="28" y="104" font-family="'Fira Code', monospace" font-size="10" fill="#94a3b8">
    Stack: Go Fiber / GORM v2
  </text>
  <text x="28" y="120" font-family="'Fira Code', monospace" font-size="10" fill="#64748b">
    Concurrency: Row Lock (ACID)
  </text>
  <text x="28" y="136" font-family="'Fira Code', monospace" font-size="10" fill="#64748b">
    State: Redis Mutex / Ticker
  </text>
  <text x="28" y="165" font-family="'Fira Code', monospace" font-size="9.5" font-weight="600" fill="#10b981">
    LATENCY: &lt; 0.35ms [OPTIMAL]
  </text>

  <!-- Dynamic Data Packet Stream (Connector 1 to 2) -->
  <path d="M 260 110 L 295 110" stroke="#38bdf8" stroke-width="1.8" class="stream"/>

  <!-- Column 2: FinTech & Payment Mutation -->
  <text x="305" y="66" font-family="'Fira Code', monospace" font-size="10" font-weight="700" fill="#38bdf8" letter-spacing="1">
    [02] FINANCIAL GATEWAY
  </text>
  <text x="305" y="86" font-family="'Fira Code', monospace" font-size="11" font-weight="600" fill="#f1f5f9">
    PaySaku v2 Dual-Engine
  </text>
  <text x="305" y="104" font-family="'Fira Code', monospace" font-size="10" fill="#94a3b8">
    Stack: Native Rust (Tokio Async)
  </text>
  <text x="305" y="120" font-family="'Fira Code', monospace" font-size="10" fill="#64748b">
    Security: HMAC-SHA256 Signed
  </text>
  <text x="305" y="136" font-family="'Fira Code', monospace" font-size="10" fill="#64748b">
    Channels: GoBiz &amp; ShopeePay
  </text>
  <text x="305" y="165" font-family="'Fira Code', monospace" font-size="9.5" font-weight="600" fill="#10b981">
    INTEGRITY: ZERO-OVERHEAD [PASS]
  </text>

  <!-- Dynamic Data Packet Stream (Connector 2 to 3) -->
  <path d="M 540 110 L 575 110" stroke="#38bdf8" stroke-width="1.8" class="stream"/>

  <!-- Column 3: Security & Server Telemetry -->
  <text x="585" y="66" font-family="'Fira Code', monospace" font-size="10" font-weight="700" fill="#38bdf8" letter-spacing="1">
    [03] PERIMETER DEFENSE
  </text>
  <text x="585" y="86" font-family="'Fira Code', monospace" font-size="11" font-weight="600" fill="#f1f5f9">
    Linux System Hardening
  </text>
  <text x="585" y="104" font-family="'Fira Code', monospace" font-size="10" fill="#94a3b8">
    Rules: OWASP Top 10 Hardened
  </text>
  <text x="585" y="120" font-family="'Fira Code', monospace" font-size="10" fill="#64748b">
    Firewall: UFW Isolated (80/443)
  </text>
  <text x="585" y="136" font-family="'Fira Code', monospace" font-size="10" fill="#64748b">
    Rate-Limit: Sliding Window
  </text>
  <text x="585" y="165" font-family="'Fira Code', monospace" font-size="9.5" font-weight="600" fill="#38bdf8">
    SECURITY: THREAT-FREE <tspan class="cursor">_</tspan>
  </text>

  <!-- Bottom Accent Line -->
  <rect x="0" y="196" width="840" height="4" fill="url(#cyanLine)"/>
</svg>
